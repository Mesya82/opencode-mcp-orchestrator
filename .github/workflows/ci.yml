name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit:security

      - name: Typecheck sandbox plugin
        run: npm run typecheck

      - name: Build and run focused tests
        env:
          RUN_CONTAINER_LIFECYCLE_INTEGRATION: "1"
        run: npm test

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail

          node --check dist/libexec/mcp-server.mjs
          node --check dist/libexec/configure-models.mjs
          node --check dist/libexec/configure-integrations.mjs
          node --check dist/libexec/setup.mjs
          node --check dist/libexec/doctor.mjs
          node --check dist/libexec/uninstall.mjs

      - name: Build test release
        shell: bash
        run: |
          set -euo pipefail

          node scripts/package-release.mjs \
            --version 0.0.0-ci \
            --repository "$GITHUB_REPOSITORY"

          cd release
          sha256sum -c SHA256SUMS
