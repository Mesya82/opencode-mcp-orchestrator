name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-e2e:
    name: Latest clients / clean container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full clean-container E2E
        env:
          E2E_CONTAINER_RUNTIME: docker
          E2E_VERSION: 0.0.0-e2e
        run: |
          set -o pipefail
          bash tests/e2e/github-userns.sh npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Upload E2E log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: ${{ runner.temp }}/e2e.log
          if-no-files-found: ignore
          retention-days: 7
